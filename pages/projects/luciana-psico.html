<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pierry Savio - Luciana luciana-psico</title>
    
    <!--CSS LINK-->
    <link rel="stylesheet" href="../../styles/index.css">

    <!--NAVICON-->
    <link rel="icon" type="image/png" href="../../img/icons/favicon.png">

    <!--FONTS-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">

    <style>
        @view-transition {
            navigation: auto;
        }
        ::view-transition-group(page-content){
            animation-duration: 0.5s;
            animation-timing-function: ease;
        }

        ::view-transition-old(page-content){
            animation-name: slide-up-out;
        }
        ::view-transition-new(page-content){
            animation-name: slide-up-in;
        }

        main{
            view-transition-name: page-content;
        }
        header{
            view-transition-name: header;
        }
        footer{
            view-transition-name: footer;
        }
        footer{
            view-transition-name: footer;
        }
        button.open-nav-button{
            view-transition-name: nav-button;
        }

        @keyframes slide-up-out {
            from{
                transform: translateY(0);
            }
            to{
                transform: translateY(-100vh);
            }
        }
        @keyframes slide-up-in {
            from{
                transform: translateY(100vh);
            }
            to{
                transform: translateY(0vh);
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="scroll-progress-line"></div>
        <p><span class="text-highlight">PIERRY SAVIO</span> - DESENVOLVEDOR WEB</p>
    </header>
    
    <main>
        <section class="luciana-psico">

            <img src="../../img/projects/luciana-psico-fav.png" alt="Logotipo" class="project-img" style="view-transition-name: luciana-psico">

            <div class="content">
                <div class="title-container">
                    <a href="../projects.html" class="return-arrow">
                        <img src="../../img/icons/arrow_left.png" alt="Return arrow">
                    </a>
                    <h2>LUCIANA PSICO</h2>
                </div>

                <div class="skills-container">
                    <p>Javascript</p>
                    <p>SASS</p>
                    <p>CSS</p>
                </div>

                <div class="texts-container">
                    <p class="text">Lorem ipsum dolor sit amet consectetur adipisicing elit. Atque recusandae cumque assumenda. Aperiam, magnam explicabo.</p>
                </div>
                
                <div class="buttons-container">
                    <a href="https://picode-cipher.netlify.app" target="_blank" class="test-button">
                        <button>TESTAR</button>
                    </a>

                    <a href="https://github.com/pierry-savio/picode-cipher" target="_blank" class="github-button">
                        <button><img src="../../img/icons/github.png" alt="Github icon"> GITHUB</button>
                    </a>
                </div>
            </div>
        </section>

        <section class="luciana-psico-previews">
            <h2>PREVIEW</h2>
            <div class="mockup-wrapper">
                <div alt="Preview" class="mockup" id="mockup"></div>
            </div>
        </section>
    </main>
    

    <!--NAV MOBILE-->
    <button class="open-nav-button closed" id="open_nav_mobile_button">
        <img src="../../img/icons/sailling.png" alt="Abrir navegação">
    </button>


    <footer class="footer-mobile opened" id="mobile_footer">
        <button class="close-nav-button" id="close_nav_mobile_button">
            <img src="../../img/icons/x.png" alt="Fechar navegação">
        </button>

        <nav class="nav-mobile">

            <a href="../../index.html">
                <img src="../../img/icons/home.png" alt="Início">
            </a>

            <a href="../../pages/projects.html" class="current-page">
                <img src="../../img/icons/projects.png" alt="Projetos">
            </a>

            <a href="../../pages/skills.html">
                <img src="../../img/icons/skills.png" alt="Habilidades">
            </a>

            <a href="../../pages/education.html">
                <img src="../../img/icons/school.png" alt="Educação">
            </a>

            <a href="../../pages/contact.html">
                <img src="../../img/icons/contact.png" alt="Contato">
            </a>
        </nav>
    </footer>

    <!--NAV PC-->
    <footer class="footer-pc" id="pc_footer">

        <nav class="nav-pc" id="nav_pc">

            <a href="../../index.html">
                <img src="../../img/icons/home.png" alt="Início">
            </a>

            <a href="../../pages/projects.html" class="current-page">
                <img src="../../img/icons/projects.png" alt="Projetos">
            </a>

            <a href="../../pages/skills.html">
                <img src="../../img/icons/skills.png" alt="Habilidades">
            </a>

            <a href="../../pages/education.html">
                <img src="../../img/icons/school.png" alt="Educação">
            </a>

            <a href="../../pages/contact.html">
                <img src="../../img/icons/contact.png" alt="Contato">
            </a>
        </nav>

        <button class="close-nav-button" id="close_nav_pc_button">
            <img src="../../img/icons/sailling.png" alt="Navegação">
        </button>
    </footer>

    <script src="../../script.js"></script>
    <script src="../../js/project.js"></script>

</body>
</html>
