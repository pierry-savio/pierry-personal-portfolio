<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pierry Savio - Projects</title>
    
    <!--CSS LINK-->
    <link rel="stylesheet" href="../styles/index.css">

    <!--NAVICON-->
    <link rel="icon" type="image/png" href="../img/icons/favicon.png">

    <!--FONTS-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">

    <style>
        @view-transition {
            navigation: auto;
        }
        ::view-transition-group(page-content){
            animation-duration: 0.5s;
            animation-timing-function: ease;
        }

        ::view-transition-old(page-content){
            animation-name: slide-up-out;
        }
        ::view-transition-new(page-content){
            animation-name: slide-up-in;
        }

        main{
            view-transition-name: page-content;
        }
        header{
            view-transition-name: header;
        }
        footer{
            view-transition-name: footer;
        }
        footer{
            view-transition-name: footer;
        }
        button.open-nav-button{
            view-transition-name: nav-button;
        }

        @keyframes slide-up-out {
            from{
                transform: translateY(0);
            }
            to{
                transform: translateY(-100vh);
            }
        }
        @keyframes slide-up-in {
            from{
                transform: translateY(100vh);
            }
            to{
                transform: translateY(0vh);
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="scroll-progress-line"></div>
        <p><span class="text-highlight">PIERRY SAVIO</span> - DESENVOLVEDOR WEB</p>
    </header>
    
    <main>
        <section class="projects" id="projects">
            <h2>PROJETOS</h2>

            <div class="arrow arrow-left" id="arrow_left">
                <img src="../img/icons/arrow_left.png" alt="Arrow">
            </div>

            </div>

            <div class="projects-container" id="projects_container">

                <!--PICODE-->
                <div class="project">
                    <a href="./projects/picode.html">
                        <img src="../img/projects/picode-fav.png" alt="Project image" style="view-transition-name: picode">
                    </a>
                    <div class="project-texts">
                        <h3>PICODE</h3>
                        <p>Codificador online com uma chave de segurança</p>
                    </div>
                </div> 

                <!--SAVIO SENA-->
                <div class="project closed-right">
                    <a href="./projects/savio-sena.html">
                        <img src="../img/projects/savio-sena-fav.png" alt="Project image" style="view-transition-name: savio-sena">
                    </a>
                    <div class="project-texts">
                        <h3>SAVIO SENA</h3>
                        <p>Analisador e gerador de jogos da Mega Sena</p>
                    </div>
                </div> 

                <!--LUCIANA PSICO-->
                <div class="project hide-right">
                    <a href="./projects/luciana-psico.html">
                        <img src="../img/projects/luciana-psico-fav.png" alt="Project image">
                    </a>
                    <div class="project-texts">
                        <h3>LU PSICO</h3>
                        <p>Portfólio de uma psicóloga</p>
                    </div>
                </div> 

                <!--CUSTOM TIC TAC TOE-->
                <div class="project hide-right">
                    <a href="./projects/custom-tictactoe.html">
                        <img src="../img/projects/custom-tictactoe-fav.png" alt="Project image">
                    </a>
                    <div class="project-texts">
                        <h3>CUSTOM TIC TAC TOE</h3>
                        <p>Um jogo da velha personalizável</p>
                    </div>
                </div>

                <!--QUOKKA-->
                <div class="project hide-right">
                    <a href="./projects/quokka.html">
                        <img src="../img/projects/quokka-fav.png" alt="Project image">
                    </a>
                    <div class="project-texts">
                        <h3>QUOKKA</h3>
                        <p>Jogo de plataforma 2D</p>
                    </div>
                </div>
            </div> 
        </section>  
    </main>
    

    <!--NAV MOBILE-->
    <button class="open-nav-button closed" id="open_nav_mobile_button">
        <img src="../img/icons/sailling.png" alt="Abrir navegação">
    </button>


    <footer class="footer-mobile opened" id="mobile_footer">
        <button class="close-nav-button" id="close_nav_mobile_button">
            <img src="../img/icons/x.png" alt="Fechar navegação">
        </button>

        <nav class="nav-mobile">

            <a href="../index.html">
                <img src="../img/icons/home.png" alt="Início">
            </a>

            <a href="./projects.html" class="current-page">
                <img src="../img/icons/projects.png" alt="Projetos">
            </a>

            <a href="./skills.html">

            </a>

            <a href="./education.html">

            </a>

            <a href="./contact.html">

        </nav>
    </footer>

    <!--NAV PC-->

        <nav class="nav-pc" id="nav_pc">

            <a href="../index.html">

            </a>

            </a>

            <a href="./skills.html">

            </a>

            <a href="./education.html">

        </nav>

        </button>
    </footer>

    <!--SCRIPT FOR HEADER AND NAV-->
    <script src="../script.js"></script>
    <!--SCRIPT FOR PROJECTS-->
    <script src="../js/projects.js"></script>
</body>
</html>
