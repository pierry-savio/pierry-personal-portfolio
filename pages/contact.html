<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pierry Savio - Contact</title>

    <!--CSS LINK-->
    <link rel="stylesheet" href="../styles/index.css">

    <!--NAVICON-->
    <link rel="icon" type="image/png" href="../img/icons/favicon.png">

    <!--FONTS-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:ital,wght@0,200..900;1,200..900&display=swap"
        rel="stylesheet">

    <style>
        @view-transition {
            navigation: auto;
        }

        ::view-transition-group(page-content) {
            animation-duration: 0.5s;
            animation-timing-function: ease;
        }

        ::view-transition-old(page-content) {
            animation-name: slide-up-out;
        }

        ::view-transition-new(page-content) {
            animation-name: slide-up-in;
        }

        main {
            view-transition-name: page-content;
        }

        header {
            view-transition-name: header;
        }

        footer {
            view-transition-name: footer;
        }

        footer {
            view-transition-name: footer;
        }

        button.open-nav-button {
            view-transition-name: nav-button;
        }

        @keyframes slide-up-out {
            from {
                transform: translateY(0);
            }

            to {
                transform: translateY(-100vh);
            }
        }

        @keyframes slide-up-in {
            from {
                transform: translateY(100vh);
            }

            to {
                transform: translateY(0vh);
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="scroll-progress-line"></div>
        <p><span class="text-highlight">PIERRY SAVIO</span> - DESENVOLVEDOR WEB</p>
    </header>

    <main>
        <section class="contact" id="contact">
            <div class="section-title-container">
                <h2 class="title">CONTATO</h2>
                <p>Entre em contato comigo através dos canais abaixo</p>
            </div>
            <div class="buttons-container">
                <a href="https://api.whatsapp.com/send/?phone=5511974838207&text&type=phone_number&app_absent=0" target="_blank" class="button">
                    <img src="../img/icons/whatsapp.png" alt="Contact icon">
                    <p>WhatsApp</p>
                </a>

                <a href="mailto:pierrysavio.pi@gmail.com" target="_blank" class="button">
                    <img src="../img/icons/email.png" alt="Contact icon">
                    <p>Email</p>
                </a>

                <a href="https://br.linkedin.com/in/pierry-dev" target="_blank" class="button">
                    <img src="../img/icons/linkedin.png" alt="Contact icon">
                    <p>LinkedIn</p>
                </a>

                <a href="https://github.com/pierry-savio" target="_blank" class="button">
                    <img src="../img/icons/github2.png" alt="Contact icon">
                    <p>Github</p>
                </a>
            </div>

            <h3>Envie uma mensagem!</h3>
            <form class="contact-form" id="contact_form">
                <input type="text" name="name" placeholder="Nome" id="name_input" required>
                <textarea name="message" placeholder="Mensagem" id="message_input" required></textarea>
                <button type="submit" id="btn_send">Enviar</button>
            </form>
        </section>
    </main>


    <!--NAV MOBILE-->
    <button class="open-nav-button closed" id="open_nav_mobile_button">
        <img src="../img/icons/sailling.png" alt="Abrir navegação">
    </button>


    <footer class="footer-mobile opened" id="mobile_footer">
        <button class="close-nav-button" id="close_nav_mobile_button">
            <img src="../img/icons/x.png" alt="Fechar navegação">
        </button>

        <nav class="nav-mobile">

            <a href="../index.html">
                <img src="../img/icons/home.png" alt="Início">
            </a>

            <a href="./projects.html">
                <img src="../img/icons/projects.png" alt="Projetos">
            </a>

            <a href="./skills.html">
                <img src="../img/icons/skills.png" alt="Habilidades">
            </a>

            <a href="./education.html">
                <img src="../img/icons/school.png" alt="Educação">
            </a>

            <a href="./contact.html" class="current-page">
                <img src="../img/icons/contact.png" alt="Contato">
            </a>
        </nav>
    </footer>

    <!--NAV PC-->
    <footer class="footer-pc" id="pc_footer">

        <nav class="nav-pc" id="nav_pc">

            <a href="../index.html">
                <img src="../img/icons/home.png" alt="Início">
            </a>

            <a href="./projects.html">
                <img src="../img/icons/projects.png" alt="Projetos">
            </a>

            <a href="./skills.html">
                <img src="../img/icons/skills.png" alt="Habilidades">
            </a>

            <a href="./education.html">
                <img src="../img/icons/school.png" alt="Educação">
            </a>

            <a href="./contact.html" class="current-page">
                <img src="../img/icons/contact.png" alt="Contato">
            </a>
        </nav>

        <button class="close-nav-button" id="close_nav_pc_button">
            <img src="../img/icons/sailling.png" alt="Navegação">
        </button>
    </footer>
    <script src="../script.js"></script>
    <script type="module" src="../js/firebase-js/firebase.js"></script>
    <script type="module" src="../js/firebase-js/form.js"></script>
    <script type="module" src="../js/firebase-js/contact-service.js"></script>
</body>

</html>
