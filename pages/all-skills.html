<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pierry Savio - Techs</title>
    
    <!--CSS LINK-->
    <link rel="stylesheet" href="../styles/index.css">

    <!--NAVICON-->
    <link rel="icon" type="image/png" href="../img/icons/favicon.png">

    <!--FONTS-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">

    <style>
        @view-transition {
            navigation: auto;
        }

        ::view-transition-group(page-content){
            animation-duration: 0.5s;
            animation-timing-function: ease;
        }

        main{
            view-transition-name: page-content;
        }
        header{
            view-transition-name: header;
        }
        h2.title{
            view-transition-name: title;
        }
        footer{
            view-transition-name: footer;
        }
        footer{
            view-transition-name: footer;
        }
        button.open-nav-button{
            view-transition-name: nav-button;
        }
        
    </style>
</head>

<body>

    <header>
        <div class="scroll-progress-line"></div>
        <p><span class="text-highlight">PIERRY SAVIO</span> - DESENVOLVEDOR WEB</p>
    </header>
    
    <main>
        <section class="all-techs">
            <h2 class="title">TECNOLOGIAS</h2>

            <div class="techs-container">
                <div class="tech">
                    <img src="../img/skills/css.png"        id="css_icon"         style="view-transition-name: css">
                    <p>CSS</p>
                </div>

                <div class="tech">
                    <img src="../img/skills/figma.png"      id="figma_icon"       style="view-transition-name: figma">
                    <p>Figma</p>
                </div>

                <div class="tech">
                    <img src="../img/skills/game maker.png" id="game_maker_icon"  style="view-transition-name: game-maker">
                    <p>Game Maker</p>
                </div>

                <div class="tech">
                    <img src="../img/skills/git.png"        id="git_icon"         style="view-transition-name: git">
                    <p>Git</p>
                </div>

                <div class="tech">
                    <img src="../img/skills/github.png"     id="github_icon"      style="view-transition-name: github">
                    <p>Github</p>
                </div>

                <div class="tech">
                    <img src="../img/skills/html.png"       id="html_icon"        style="view-transition-name: html">
                    <p>HTML</p>
                </div>

                <div class="tech">
                    <img src="../img/skills/java.png"       id="java_icon"        style="view-transition-name: java">
                    <p>Java</p>
                </div>

                <div class="tech">
                    <img src="../img/skills/js.png"         id="js_icon"          style="view-transition-name: js">
                    <p>Javascript</p>
                </div>

                <div class="tech">
                    <img src="../img/skills/sass.png"       id="sass_icon"        style="view-transition-name: sass">   
                    <p>SASS</p>
                </div>
            </div>
        </section>
    </main>

    <!--NAV MOBILE-->
    <button class="open-nav-button closed" id="open_nav_mobile_button">
        <img src="../img/icons/sailling.png" alt="Abrir navegação">
    </button>


    <footer class="footer-mobile opened" id="mobile_footer">
        <button class="close-nav-button" id="close_nav_mobile_button">
            <img src="../img/icons/x.png" alt="Fechar navegação">
        </button>

        <nav class="nav-mobile">

            <a href="../index.html">
                <img src="../img/icons/home.png" alt="Início">
            </a>

            <a href="./projects.html">
                <img src="../img/icons/projects.png" alt="Projetos">
            </a>

            <a href="./skills.html" class="current-page">
                <img src="../img/icons/skills.png" alt="Habilidades">
            </a>

            <a href="./education.html">
                <img src="../img/icons/school.png" alt="Educação">
            </a>

            <a href="./contact.html">
                <img src="../img/icons/contact.png" alt="Contato">
            </a>
        </nav>
    </footer>

    <!--NAV PC-->
    <footer class="footer-pc" id="pc_footer">

        <nav class="nav-pc" id="nav_pc">

            <a href="../index.html">
                <img src="../img/icons/home.png" alt="Início">
            </a>

            <a href="./projects.html">
                <img src="../img/icons/projects.png" alt="Projetos">
            </a>

            <a href="./skills.html" class="current-page">
                <img src="../img/icons/skills.png" alt="Habilidades">
            </a>

            <a href="./education.html">
                <img src="../img/icons/school.png" alt="Educação">
            </a>

            <a href="./contact.html">
                <img src="../img/icons/contact.png" alt="Contato">
            </a>
        </nav>

        <button class="close-nav-button" id="close_nav_pc_button">
            <img src="../img/icons/sailling.png" alt="Navegação">
        </button>
    </footer>
    <script src="../script.js"></script>
</body>
</html>
