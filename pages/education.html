<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pierry Savio - Education</title>

    <!--CSS LINK-->
    <link rel="stylesheet" href="../styles/index.css">

    <!--NAVICON-->
    <link rel="icon" type="image/png" href="../img/icons/favicon.png">

    <!--FONTS-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:ital,wght@0,200..900;1,200..900&display=swap"
        rel="stylesheet">

    <style>
        @view-transition {
            navigation: auto;
        }

        ::view-transition-group(page-content) {
            animation-duration: 0.5s;
            animation-timing-function: ease;
        }

        ::view-transition-old(page-content) {
            animation-name: slide-up-out;
        }

        ::view-transition-new(page-content) {
            animation-name: slide-up-in;
        }

        main {
            view-transition-name: page-content;
        }

        header {
            view-transition-name: header;
        }

        footer {
            view-transition-name: footer;
        }

        footer {
            view-transition-name: footer;
        }

        button.open-nav-button {
            view-transition-name: nav-button;
        }

        @keyframes slide-up-out {
            from {
                transform: translateY(0);
            }

            to {
                transform: translateY(-100vh);
            }
        }

        @keyframes slide-up-in {
            from {
                transform: translateY(100vh);
            }

            to {
                transform: translateY(0vh);
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="scroll-progress-line"></div>
        <p><span class="text-highlight">PIERRY SAVIO</span> - DESENVOLVEDOR WEB</p>
    </header>

    <main>
        <section class="education" id="education">
            <h2 class="title">EDUCAÇÃO</h2>

            <div class="courses-container">

                <h3 class="course-title">FATEC</h3>

                <div class="vertical-line"></div>

                <div class="course closed" id="course">
                    <div class="course-header">
                        <p>code</p>
                        <p>- cursando</p>
                    </div>
                    <div class="course-content">
                        <img src="../img/education/fatec-preview.jpg" alt="fatec" class="course-img">
                        <img src="../img/icons/arrow_down.png" alt="Arrow down" class="arrow-down">
                        <div class="text-container">
                            <div class="time-container">
                                <p class="date">02/2026</p>
                                <p>-</p>
                                <p class="date">Atual</p>
                            </div>

                            <ul>
                                <li>Análise e Desenvolvimento de Sistemas</li>
                                <li>FATEC Zona Sul</li>
                                <li>02/2026</li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>


    <!--NAV MOBILE-->
    <button class="open-nav-button closed" id="open_nav_mobile_button">
        <img src="../img/icons/sailling.png" alt="Abrir navegação">
    </button>


    <footer class="footer-mobile opened" id="mobile_footer">
        <button class="close-nav-button" id="close_nav_mobile_button">
            <img src="../img/icons/x.png" alt="Fechar navegação">
        </button>

        <nav class="nav-mobile">

            <a href="../index.html">
                <img src="../img/icons/home.png" alt="Início">
            </a>

            <a href="./projects.html">
                <img src="../img/icons/projects.png" alt="Projetos">
            </a>

            <a href="./skills.html">
                <img src="../img/icons/skills.png" alt="Habilidades">
            </a>

            <a href="./education.html" class="current-page">
                <img src="../img/icons/school.png" alt="Educação">
            </a>

            <a href="./contact.html">
                <img src="../img/icons/contact.png" alt="Contato">
            </a>
        </nav>
    </footer>

    <!--NAV PC-->
    <footer class="footer-pc" id="pc_footer">

        <nav class="nav-pc" id="nav_pc">

            <a href="../index.html">
                <img src="../img/icons/home.png" alt="Início">
            </a>

            <a href="./projects.html">
                <img src="../img/icons/projects.png" alt="Projetos">
            </a>

            <a href="./skills.html">
                <img src="../img/icons/skills.png" alt="Habilidades">
            </a>

            <a href="./education.html" class="current-page">
                <img src="../img/icons/school.png" alt="Educação">
            </a>

            <a href="./contact.html">
                <img src="../img/icons/contact.png" alt="Contato">
            </a>
        </nav>

        <button class="close-nav-button" id="close_nav_pc_button">
            <img src="../img/icons/sailling.png" alt="Navegação">
        </button>
    </footer>
    <script src="../script.js"></script>
    <script src="../js/education.js"></script>
</body>

</html>
